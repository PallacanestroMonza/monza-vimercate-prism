<title>Pallacanestro Monza - DI.PO. Vimercate | Overlay</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Arial,Helvetica,sans-serif}
  *{box-sizing:border-box}
  .wrap{width:1100px;height:180px;margin:0;background:transparent;filter:drop-shadow(0 10px 20px rgba(0,0,0,.32))}
  .scoreboard{height:180px;display:grid;grid-template-columns:1fr 210px 1fr;border-radius:24px;overflow:hidden;background:#0b1728}
  .team{display:flex;align-items:center;gap:14px;padding:0 22px;color:#fff;position:relative}
  .home{background:linear-gradient(135deg,#e32b45 0%,#a80f29 100%);border-bottom:10px solid #fff}
  .away{background:linear-gradient(135deg,#1f7a4b 0%,#0a3e28 72%,#101815 100%);border-bottom:10px solid #f28b25}
  .team-info{min-width:0;flex:1}
  .name{font-size:22px;font-weight:950;letter-spacing:.45px;line-height:1.02;text-transform:uppercase;white-space:normal}
  .name .line{display:block}
  .away .name{font-size:22px}
  .meta{margin-top:9px;font-size:14px;font-weight:850;letter-spacing:.45px;opacity:.96}
  .score{font-size:68px;font-weight:950;line-height:1;min-width:70px;text-align:center}
  .logo{width:72px;height:72px;border-radius:50%;background:#fff;display:grid;place-items:center;overflow:hidden;flex:0 0 auto;border:4px solid rgba(255,255,255,.38);box-shadow:0 4px 14px rgba(0,0,0,.18)}
  .logo img{width:100%;height:100%;object-fit:contain;padding:3px}
  .away .logo img{padding:8px}
  .center{background:linear-gradient(180deg,#12233e 0%,#0a1525 100%);color:#fff;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;border-left:1px solid rgba(255,255,255,.08);border-right:1px solid rgba(255,255,255,.08)}
  .period{font-size:16px;font-weight:900;letter-spacing:1px;text-transform:uppercase}
  .clock{font-size:52px;font-weight:950;letter-spacing:1px;line-height:1}
  .status{font-size:12px;font-weight:900;letter-spacing:1.8px;opacity:.8;text-transform:uppercase;min-height:14px}
  @media (max-width:1100px){.wrap{transform-origin:top left;transform:scale(calc(100vw / 1100))}}
</style>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAysJGD5jBnTEPY1lSlvk9yRfTXtyVZHwU",
  authDomain: "tabellone-monza-agrate-3f7a1.firebaseapp.com",
  databaseURL: "https://tabellone-monza-agrate-3f7a1-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "tabellone-monza-agrate-3f7a1",
  storageBucket: "tabellone-monza-agrate-3f7a1.firebasestorage.app",
  messagingSenderId: "1065515511910",
  appId: "1:1065515511910:web:c2939024b149145b4dbda7"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const ref = db.ref('scoreboards/monza-dipo-vimercate/live');
const DEFAULT_STATE = {homeScore:0,awayScore:0,homeFouls:0,awayFouls:0,homeTimeouts:0,awayTimeouts:0,period:1,clock:600,running:false,startedAt:null};
let state = {...DEFAULT_STATE};
let serverOffset = 0;

db.ref('.info/serverTimeOffset').on('value', s => serverOffset = s.val() || 0);
ref.transaction(cur => cur || DEFAULT_STATE).catch(console.error);
ref.on('value', snap => { if(snap.exists()) state = {...DEFAULT_STATE,...snap.val()}; render(); }, console.error);
function nowServer(){return Date.now()+serverOffset}
function remainingSeconds(){let r=Number(state.clock??600);if(state.running&&state.startedAt)r-=Math.floor((nowServer()-state.startedAt)/1000);return Math.max(0,r)}
function fmt(sec){sec=Math.max(0,Math.floor(sec));return `${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`}
function periodLabel(p){return p<=4?`${p}° QUARTO`:`OT ${p-4}`}
function render(){
  const rem=remainingSeconds();
  document.getElementById('homeScore').textContent=state.homeScore;
  document.getElementById('awayScore').textContent=state.awayScore;
  document.getElementById('homeFouls').textContent=state.homeFouls;
  document.getElementById('awayFouls').textContent=state.awayFouls;
  document.getElementById('homeTimeouts').textContent=state.homeTimeouts;
  document.getElementById('awayTimeouts').textContent=state.awayTimeouts;
  document.getElementById('period').textContent=periodLabel(Number(state.period||1));
  document.getElementById('clock').textContent=fmt(rem);
  document.getElementById('status').textContent=state.running&&rem>0?'IN CORSO':'IN PAUSA';
  if(state.running&&rem<=0)ref.update({clock:0,running:false,startedAt:null}).catch(console.error);
}
setInterval(render,200);
</script>
